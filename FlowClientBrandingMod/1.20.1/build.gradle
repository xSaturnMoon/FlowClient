plugins {
    id 'fabric-loom' version '1.10.5'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = '1.0.0'
group = 'com.flowclient'

base.archivesName = 'flowclient-branding-1.20.1'

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

configurations {
    embedded
}

def embeddedMods = [
    jei      : "mezz.jei:jei-1.20.1-fabric:${jei_version}",
    voicechat: "maven.modrinth:simple-voice-chat:fabric-${voicechat_version}",
]

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly embeddedMods.jei
    compileOnly embeddedMods.voicechat

    embeddedMods.each { name, dependency ->
        embedded(dependency)
    }
}

def embeddedJarNames = [
    'jei.jar'      : 'jei-1.20.1-fabric',
    'voicechat.jar': 'simple-voice-chat',
]

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(project.provider {
        project.configurations.embedded.files
    }) {
        into 'META-INF/jars'
        rename { String fileName ->
            def lowered = fileName.toLowerCase(Locale.ROOT)
            def match = embeddedJarNames.find { entry -> lowered.contains(entry.value) }
            match ? match.key : fileName
        }
    }

    finalizedBy tasks.shadowJar
}

tasks.shadowJar {
    zip64 = true
    archiveClassifier = ''
    dependsOn tasks.jar

    // Do not merge runtime/implementation deps into the jar (default Shadow behaviour).
    configurations = []

    from jar.archiveFile.map { zipTree(it) }

    from(project.provider {
        project.configurations.embedded.files
    }) {
        into 'META-INF/jars'
        rename { String fileName ->
            def lowered = fileName.toLowerCase(Locale.ROOT)
            def match = embeddedJarNames.find { entry -> lowered.contains(entry.value) }
            match ? match.key : fileName
        }
    }

    from('src/main/resources/licenses') {
        into 'META-INF/licenses'
        include 'JEI-LICENSE.txt', 'JEI-NOTICE.txt', 'VOICECHAT-LICENSE.txt', 'VOICECHAT-NOTICE.txt'
    }

    exclude 'net/fabricmc/loader/**'
    exclude 'net/fabricmc/api/**'
    exclude 'META-INF/jars/mixinextras-*.jar'
    exclude 'META-INF/jars/fabric-*.jar'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.assemble {
    dependsOn tasks.shadowJar
}
