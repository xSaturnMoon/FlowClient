pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'flowclient-branding'

include '1.20.1'

def requested = gradle.startParameter.taskNames.join(' ').toLowerCase()
if (requested.contains('26.2') || requested.contains('buildall')) {
    include '26.2'
}
if (requested.contains('1.21.1') || requested.contains('neoforge') || requested.contains('buildall')) {
    include '1.21.1-neoforge'
}
